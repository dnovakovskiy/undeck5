<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 116" width="580" height="116" role="img" aria-label="undeck5 logo — 3 friends: 2x B2B DJs + 1x drum machine">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="100%" stop-color="#171029" />
    </linearGradient>
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a2b" />
      <stop offset="52%" stop-color="#ff2bd6" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#ff2bd6" />
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="576" height="112" rx="18" fill="url(#bgGrad)" stroke="#2c3550" stroke-width="2" />

  <!-- Booth Icon: 2 B2B Decks + 3rd Friend's Drum Machine -->
  <g transform="translate(20, 18)">
    <rect x="0" y="0" width="80" height="80" rx="14" fill="#101522" stroke="url(#ringGrad)" stroke-width="2" />
    <!-- 3 Friend Indicator Pips (2 cyan B2B DJs + 1 neon-orange Drum Machine player) -->
    <circle cx="22" cy="15" r="5" fill="#00e5ff" />
    <circle cx="38" cy="15" r="5" fill="#00e5ff" />
    <circle cx="58" cy="15" r="5.5" fill="#ff6a2b" stroke="#ffd43b" stroke-width="1.2" />
    <!-- 2 mini B2B jog platters + right step grid -->
    <circle cx="21" cy="44" r="11" fill="none" stroke="#00e5ff" stroke-width="2" />
    <circle cx="21" cy="44" r="3.5" fill="#00e5ff" />
    <circle cx="40" cy="44" r="11" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="40" cy="44" r="3.5" fill="#38bdf8" />
    <!-- Friend #3 Drum Sequencer Pads -->
    <rect x="55" y="32" width="8" height="7" rx="1.5" fill="#ff5232" />
    <rect x="65" y="32" width="8" height="7" rx="1.5" fill="#ff9626" />
    <rect x="55" y="41" width="8" height="7" rx="1.5" fill="#ffd43b" />
    <rect x="65" y="41" width="8" height="7" rx="1.5" fill="#a3e635" />
    <rect x="55" y="50" width="18" height="6" rx="1.5" fill="#ff2bd6" />
    <!-- Bottom label inside badge -->
    <text x="40" y="71" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="800" fill="#e2e8f0">2×B2B + #5</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(118, 0)">
    <text x="0" y="57" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="900" letter-spacing="1.5" fill="#f8fafc">
      undeck<tspan fill="url(#neonText)" filter="url(#glow)">5</tspan>
    </text>
    <rect x="220" y="25" width="124" height="24" rx="12" fill="#1f1633" stroke="#ff2bd6" stroke-width="1.3" />
    <text x="282" y="41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="800" letter-spacing="1.2" fill="#ff7ce5">LOCAL PROTOTYPE</text>

    <text x="2" y="85" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="0.5" fill="#9fb0cc">
      3 FRIENDS · 2× B2B DJING + 1× LAPTOP DRUM MACHINE
    </text>
  </g>
</svg>
