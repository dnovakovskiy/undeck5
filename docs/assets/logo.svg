<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 112" width="560" height="112" role="img" aria-label="player5 logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="100%" stop-color="#151026" />
    </linearGradient>
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a2b" />
      <stop offset="52%" stop-color="#ff2bd6" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#ff2bd6" />
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="556" height="108" rx="18" fill="url(#bgGrad)" stroke="#2c3550" stroke-width="2" />

  <!-- Hardware 4-Deck + Deck #5 Badge Icon -->
  <g transform="translate(22, 18)">
    <rect x="0" y="0" width="76" height="76" rx="14" fill="#101522" stroke="url(#ringGrad)" stroke-width="2" />
    <!-- 4 mini step pads -->
    <rect x="10" y="10" width="12" height="10" rx="2" fill="#ff5232" />
    <rect x="25" y="10" width="12" height="10" rx="2" fill="#ff9626" />
    <rect x="40" y="10" width="12" height="10" rx="2" fill="#ffd43b" />
    <rect x="55" y="10" width="11" height="10" rx="2" fill="#f8fafc" />
    <!-- Jog / Phase circle -->
    <circle cx="38" cy="46" r="20" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="94 14" />
    <circle cx="38" cy="46" r="11" fill="#182036" stroke="#ff2bd6" stroke-width="2" />
    <text x="38" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800" fill="#ffffff">5</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(116, 0)">
    <text x="0" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="900" letter-spacing="1.5" fill="#f8fafc">
      player<tspan fill="url(#neonText)" filter="url(#glow)">5</tspan>
    </text>
    <rect x="206" y="24" width="122" height="24" rx="12" fill="#1f1633" stroke="#ff2bd6" stroke-width="1.3" />
    <text x="267" y="40" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="800" letter-spacing="1.2" fill="#ff7ce5">LOCAL PROTOTYPE</text>

    <text x="2" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" letter-spacing="0.6" fill="#9fb0cc">
      DECK #5 FOR B2B DJ SESSIONS · DRUMS · PADS · BUILDUP FX
    </text>
  </g>
</svg>
