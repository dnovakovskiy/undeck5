<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="960" height="290" role="img" aria-label="Simple 3-step install and DJ booth connection flow">
  <defs>
    <linearGradient id="bgSt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="100%" stop-color="#131826" />
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#34d399" />
    </marker>
  </defs>

  <rect x="2" y="2" width="956" height="286" rx="18" fill="url(#bgSt)" stroke="#263042" stroke-width="2" />

  <text x="36" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">
    Install &amp; Plug Into Any Booth in 3 Steps
  </text>
  <text x="924" y="42" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#34d399">
    No Plugins · Runs Locally
  </text>

  <!-- Step 1 -->
  <g transform="translate(36, 70)">
    <rect width="260" height="176" rx="14" fill="#121826" stroke="#38bdf8" stroke-width="2" />
    <text x="20" y="34" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" fill="#38bdf8">STEP 1 · LAUNCH</text>
    <text x="20" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Open on Laptop</text>
    <text x="20" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#e2e8f0">• Double-click offline HTML</text>
    <text x="20" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#94a3b8">  or run local bridge:</text>
    <text x="20" y="152" font-family="ui-monospace, Menlo, monospace" font-size="12.5" font-weight="700" fill="#fbbf24">localhost:17505</text>
  </g>

  <line x1="304" y1="158" x2="342" y2="158" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr)" />

  <!-- Step 2 -->
  <g transform="translate(350, 70)">
    <rect width="260" height="176" rx="14" fill="#121826" stroke="#34d399" stroke-width="2" />
    <text x="20" y="34" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" fill="#34d399">STEP 2 · SOUNDS</text>
    <text x="20" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Plug In Your Kits</text>
    <text x="20" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#e2e8f0">• Built-in Analog Synth</text>
    <text x="20" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#e2e8f0">• Pick any NI / WAV folder</text>
    <text x="20" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#34d399">• Auto-mounts /Users/Shared</text>
  </g>

  <line x1="618" y1="158" x2="656" y2="158" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrG)" />

  <!-- Step 3 -->
  <g transform="translate(664, 70)">
    <rect width="260" height="176" rx="14" fill="#121826" stroke="#ff6a2b" stroke-width="2" />
    <text x="20" y="34" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" fill="#ff6a2b">STEP 3 · SYNC &amp; PLAY</text>
    <text x="20" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Lock to the Booth</text>
    <text x="20" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#e2e8f0">• Ethernet → CDJ Pro DJ Link</text>
    <text x="20" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#e2e8f0">• Wi-Fi → Ableton Link</text>
    <text x="20" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#fbbf24">• Audio → Mixer Ch 5 / Aux</text>
  </g>
</svg>
