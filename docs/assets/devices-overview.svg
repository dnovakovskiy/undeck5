<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="4 emulated club machines sharing one clock and sample or synth engine">
  <defs>
    <linearGradient id="bgOv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="100%" stop-color="#131826" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="956" height="276" rx="18" fill="url(#bgOv)" stroke="#263042" stroke-width="2" />

  <!-- Top bar -->
  <text x="36" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">
    4 Machines in 1 Window
  </text>
  <text x="924" y="42" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#94a3b8">
    ⌥1–⌥4 Switch  ·  \ Active / Passive  ·  ⌥5 Booth Split
  </text>

  <!-- 4 Clean, Sparse Cards -->
  <!-- Card 1 -->
  <g transform="translate(36, 66)">
    <rect width="208" height="128" rx="14" fill="#121826" stroke="#ff6a2b" stroke-width="2" />
    <text x="18" y="34" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" fill="#ff6a2b">⌥1 · STEP GRID</text>
    <text x="18" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">TR Sequencer</text>
    <text x="18" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">64-step A–D grid</text>
    <text x="18" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">7 synth kits + NI WAVs</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(262, 66)">
    <rect width="208" height="128" rx="14" fill="#121826" stroke="#a3e635" stroke-width="2" />
    <text x="18" y="34" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" fill="#a3e635">⌥2 · LAYER DECK</text>
    <text x="18" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Pattern Player</text>
    <text x="18" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Heavy sub &amp; breakbeats</text>
    <text x="18" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">1-button buildup → drop</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(488, 66)">
    <rect width="208" height="128" rx="14" fill="#121826" stroke="#00e5ff" stroke-width="2" />
    <text x="18" y="34" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" fill="#00e5ff">⌥3 · PAD SAMPLER</text>
    <text x="18" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">DJS-1000 Deck</text>
    <text x="18" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">8 Scenes + 4×4 RGB pads</text>
    <text x="18" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Touch strip rolls &amp; rec</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(714, 66)">
    <rect width="210" height="128" rx="14" fill="#121826" stroke="#c084fc" stroke-width="2" />
    <text x="18" y="34" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" fill="#c084fc">⌥4 · REMIX FX</text>
    <text x="18" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">RMX-1000</text>
    <text x="18" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">3-band kill &amp; Scene FX</text>
    <text x="18" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Hold R vinyl brake drop</text>
  </g>

  <!-- Bottom Shared Bus -->
  <rect x="36" y="214" width="888" height="44" rx="10" fill="#0f1523" stroke="#2d3a52" stroke-width="1.5" />
  <text x="480" y="241" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">
    Shared Engine: <tspan fill="#fbbf24">Synth DSP</tspan> or <tspan fill="#34d399">Your NI / WAV Samples</tspan>  ·  Locked to <tspan fill="#38bdf8">CDJs / Ableton Link / MIDI</tspan>
  </text>
</svg>
